services:
  postgres:
    image: postgres:18.6
    container_name: research-board-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: researchboard

    ports:
      - "5432:5432"

    volumes:
      - research_board_postgres_data:/var/lib/postgresql

volumes:
  research_board_postgres_data:
